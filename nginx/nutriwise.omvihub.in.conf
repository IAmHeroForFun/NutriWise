# ==============================================================================
# NutriWise — Nginx Configuration for nutriwise.omvihub.in
# Place this file in your central Nginx conf.d directory (or include in nginx.conf)
# E.g.: /opt/services/omvi_blog/nginx/conf.d/nutriwise.conf
# or your central Nginx container configuration folder.
# ==============================================================================

upstream nutriwise {
    server nutriwise_web:8000;
}

# 1. HTTP ➔ HTTPS Redirect
server {
    listen 80;
    server_name nutriwise.omvihub.in;

    # Let's Encrypt validation challenge (if using webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Reverse Proxy
server {
    listen 443 ssl;
    http2 on;
    server_name nutriwise.omvihub.in;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/nutriwise.omvihub.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutriwise.omvihub.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow up to 50MB file uploads for PDF/EPUB medical ingestion
    client_max_body_size 50M;

    # Static assets (routed from shared volume or host volume)
    location /static/ {
        alias /opt/services/nutriwise/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Uploaded documents and media
    location /media/ {
        alias /opt/services/nutriwise/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to NutriWise Django Gunicorn
    location / {
        proxy_pass http://nutriwise;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Allow sufficient time for PyMuPDF book ingestion and Gemini API calls
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
