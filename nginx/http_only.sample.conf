# ==============================================================================
# NutriWise — Nginx Sample: HTTP Only Configuration
# Use this configuration for:
#   1. Initial deployment before SSL certificate is issued
#   2. Local Docker testing (http://localhost)
#   3. Deployments behind an external SSL terminator (AWS ALB, Cloudflare flexible SSL)
# ==============================================================================

upstream django_upstream {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Maximum file upload size (matches Django FILE_UPLOAD_MAX_MEMORY_SIZE = 50MB)
    client_max_body_size 50M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt ACME Challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve static assets directly from persistent Docker volume with 30-day cache
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Serve uploaded media documents directly with 7-day cache
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all dynamic requests to Gunicorn WSGI container
    location / {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for document OCR and AI ingestion (allows up to 120s)
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
