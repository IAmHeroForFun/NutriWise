# ==============================================================================
# NutriWise — Stage 1: Pre-SSL HTTP Configuration for nutriwise.omvihub.in
# Use this configuration BEFORE running Certbot to generate SSL certificates.
# It starts cleanly on Port 80 without SSL errors and allows Certbot ACME
# challenge verification.
#
# Once Certbot has successfully generated the certificates in:
#   /etc/letsencrypt/live/nutriwise.omvihub.in/
# Replace this file with 'nutriwise.omvihub.in.conf' (Stage 2) and reload Nginx.
# ==============================================================================

upstream nutriwise {
    server nutriwise_web:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name nutriwise.omvihub.in;

    # Let's Encrypt domain validation directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Static assets
    location /static/ {
        alias /opt/services/nutriwise/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Uploaded documents and media
    location /media/ {
        alias /opt/services/nutriwise/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to NutriWise web container
    location / {
        proxy_pass http://nutriwise;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow sufficient time for PDF/EPUB OCR ingestion and Gemini AI
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
